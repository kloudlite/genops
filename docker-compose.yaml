services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: db
    ports:
      - "5432:5432"
    volumes:
      - .data/db:/var/lib/postgresql/data
  nats:
    image: nats:latest
    ports:
      - "4222:4222"
    command: ["-js"]
    volumes:
      - .data/nats:/data
